name: SSH Git Pull Workflow

on:
  push:
    branches:
      - master

jobs:
  ssh-git-pull:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: SSH and Git Pull
        env:
          SERVER: ${{ secrets.SERVER }}
          USER: ${{ secrets.USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}  # GitHub username
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}      # Ensure this secret is defined in your repository settings
        run: |
          sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no $USER@$SERVER << EOF
          cd /var/www/html/$REPO_NAME
          echo "Navigating to /var/www/html/$REPO_NAME"
          
          # Pull the latest changes from the master branch
          git stash
          git pull https://$GIT_USERNAME:$GIT_TOKEN@github.com/$USER/$REPO_NAME.git master
          echo "Pulled the latest changes from the master branch."
          
          # Restart Laravel and Vite using PM2
          pm2 restart laravel
          pm2 restart vite
          
          git stash pop
          EOF