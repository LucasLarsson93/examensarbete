name: Code Quality Checks

on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.x
          tools: composer

      - name: Install dependencies
        run: npm install && composer install --no-progress --no-suggest

      - name: Run Laravel Pint (PHP Formatter)
        run: vendor/bin/pint

      - name: Run Blade Formatter
        run: npx blade-formatter "resources/views/**/*.blade.php" --write
